# /etc/systemd/system/maxeco.service.d/10-max-desempenho.conf
[Unit]
After=max-desempenho.service pc-panel-fans.service

[Service]
# PC Panel applies its fan choice again every time the panel writes it (about
# once a minute with a graphics card curve). Eco mode owns the fans while it
# is on, so that pauses here and maxeco-restore.service turns it back on.
ExecStartPre=-/usr/bin/systemctl stop pc-panel-fans.path pc-panel-fans.service
ExecStopPost=-/usr/bin/systemctl --no-block start maxeco-restore.service
